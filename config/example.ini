# Пример файла конфигурации для наложения водяного знака

# Пути к файлам (относительно папки, откуда запускается программа)
input_path = examples/original.bmp
watermark_path = examples/watermark.bmp
output_path = examples/result.bmp

# Параметры наложения
# alpha - прозрачность (от 0.0 до 1.0)
# offset_x, offset_y - смещение (координаты верхнего левого угла)
alpha = 0.4
offset_x = 10
offset_y = 10